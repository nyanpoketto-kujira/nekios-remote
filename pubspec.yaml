name: nekios_remote
description: "Remote pusat Nekios: satu aplikasi untuk display sekolah (nekios-core, WS 8920) dan display masjid masjid-you (protokol warisan via WS 8080 / Bluetooth Classic — Rute A)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Protokol bersama ekosistem Nekios (envelope paket, codec,
  # klien WebSocket) — repo PUBLIK, jadi CI bisa me-resolve
  # dependensi git HTTPS ini tanpa kredensial.
  nekios_core:
    git:
      url: https://github.com/nyanpoketto-kujira/nekios-core.git
      ref: main

  # Daftar display tersimpan + IP terakhir (auto-save).
  shared_preferences: ^2.3.2

  # Pilih gambar logo dari galeri.
  image_picker: ^1.1.2

  # Peramping gambar logo (maks 512px) sebelum dikirim base64.
  image: ^4.3.0

  # Pilih berkas JSON jadwal untuk dikirim ke display.
  file_picker: ^13.4.0

  # Klien WebSocket dialek masjid (Rute A): kanal menuju server
  # warisan tv_display masjid-you di port 8080.
  web_socket_channel: ^3.0.3

  # Bluetooth Classic (RFCOMM) menuju TV masjid — plugin lokal port
  # dari bluetooth_sync masjid-you; pipa byte mentah, framing di Dart
  # (lib/masjid/). Android saja.
  bluetooth_rfcomm:
    path: packages/bluetooth_rfcomm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Jadwal bawaan SMKN 1 Ukui untuk titik awal Editor Jadwal —
    # salinan persis `assets/jadwal-tkj.json` nekios-school
    # (lihat ADR-002).
    - assets/jadwal-bawaan.json
